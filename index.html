
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Youssef AI Studio</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090d18;color:#fff;
 font-family:Arial,sans-serif;min-height:100vh;
}
header{
 padding:24px 7%;border-bottom:1px solid #202a40;
 display:flex;justify-content:space-between;align-items:center;
}
.logo{font-size:23px;font-weight:bold;color:#9d8cff}
.logo span{color:white}
.tag{font-size:11px;color:#a8aabd;letter-spacing:2px}
main{max-width:1000px;margin:40px auto;padding:0 18px}
h1{text-align:center;font-size:36px;margin-bottom:8px}
.subtitle{text-align:center;color:#9ba5bd;margin-bottom:35px}
.panel{
 background:#111a2c;border:1px solid #25314a;
 border-radius:18px;padding:24px;margin-bottom:22px;
}
h2{font-size:19px;margin:0 0 15px}
label{display:block;color:#c2c9dc;font-size:13px;margin:16px 0 8px}
textarea,select{
 width:100%;background:#0b1220;color:white;
 border:1px solid #34415c;border-radius:10px;
 padding:13px;font-size:15px;outline:none;
}
textarea{min-height:110px;resize:vertical;line-height:1.6}
textarea:focus,select:focus{border-color:#9d8cff}
button{
 border:0;border-radius:10px;padding:13px 18px;
 font-weight:bold;cursor:pointer;font-size:14px;
 transition:.2s;
}
button:hover{opacity:.88;transform:translateY(-1px)}
.primary{background:#8466f5;color:white}
.secondary{background:#26334c;color:white}
.green{background:#167e68;color:white}
button:disabled{opacity:.5;cursor:wait;transform:none}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.result{display:none;margin-top:20px}
.result img{width:100%;border-radius:12px;display:block}
.status{color:#aab4cc;font-size:13px;margin-top:12px;line-height:1.6}
footer{text-align:center;color:#727e96;padding:30px;font-size:12px}
@media(max-width:600px){
 header{padding:18px}
 h1{font-size:28px}
 .panel{padding:17px}
 .grid{grid-template-columns:1fr}
 .buttons button{flex:1}
}
</style>
</head>
<body>

<header>
 <div>
  <div class="logo">Youssef <span>AI Studio</span></div>
  <div class="tag">CREATE WITHOUT LIMITS</div>
 </div>
 <div style="color:#a9a1ff;font-size:13px">AI IMAGE STUDIO</div>
</header>

<main>
 <h1>Create Something Amazing</h1>
 <p class="subtitle">Your creative AI workspace</p>

 <section class="panel">
  <h2>✨ Prompt Enhancer</h2>
  <p style="color:#9ba5bd;font-size:13px">
   Turn a simple idea into a detailed image prompt.
  </p>

  <label for="prompt">Your idea</label>
  <textarea id="prompt" placeholder="Example: A cat in space..."></textarea>

  <div class="buttons">
   <button class="primary" id="enhanceBtn" onclick="enhancePrompt()">
    ✨ Enhance Prompt
   </button>
   <button class="secondary" onclick="copyPrompt()">
    Copy Prompt
   </button>
  </div>

  <div id="enhancedBox" style="display:none;margin-top:20px">
   <label>Enhanced Prompt</label>
   <textarea id="enhancedPrompt" readonly></textarea>
   <div class="buttons">
    <button class="green" onclick="useEnhanced()">Use This Prompt</button>
    <button class="secondary" onclick="copyEnhanced()">Copy Enhanced</button>
   </div>
  </div>
  <div class="status" id="enhanceStatus"></div>
 </section>

 <section class="panel">
  <h2>🎨 AI Image Generator</h2>

  <label for="ratio">Image Dimensions</label>
  <select id="ratio">
   <option value="square">Square (1:1)</option>
   <option value="portrait">Portrait (9:16)</option>
   <option value="landscape">Landscape (16:9)</option>
  </select>

  <label for="style">Choose Image Style</label>
  <select id="style">
   <option value="none">Default</option>
   <option value="realistic">Realistic</option>
   <option value="anime">Anime</option>
   <option value="cinematic">Cinematic</option>
   <option value="3d">3D Render</option>
   <option value="watercolor">Watercolor</option>
   <option value="oil">Oil Painting</option>
   <option value="vector">Vector Art</option>
   <option value="cyberpunk">Cyberpunk</option>
   <option value="pixel">Pixel Art</option>
   <option value="fantasy">Fantasy</option>
   <option value="retro">Retro</option>
   <option value="comic">Comic Book</option>
  </select>

  <div class="buttons">
   <button class="primary" id="generateBtn" onclick="generateImage()">
    Generate Image
   </button>
  </div>

  <div class="status" id="imageStatus"></div>

  <div class="result" id="result">
   <img id="generatedImage" alt="Generated AI image">
   <div class="buttons">
    <button class="green" onclick="downloadImage()">Download Image</button>
   </div>
  </div>
 </section>
</main>

<footer>© 2026 Youssef AI Studio — Create Without Limits</footer>

<script>
const API_URL = "https://youssef-ai-studio-api.kiryabokiry.workers.dev";

function enhancePrompt(){
 const input=document.getElementById("prompt").value.trim();
 const status=document.getElementById("enhanceStatus");
 const btn=document.getElementById("enhanceBtn");

 if(!input){
  status.textContent="Please enter your idea first.";
  return;
 }

 btn.disabled=true;
 btn.textContent="Enhancing...";
 status.textContent="Improving your prompt...";

 // Local prompt enhancement: no additional API or paid service.
 const details =
 ", highly detailed composition, beautiful lighting, rich colors, " +
 "professional quality, carefully designed background, sharp focus, " +
 "intricate details, visually stunning artwork";

 const enhanced = input + details;

 document.getElementById("enhancedPrompt").value=enhanced;
 document.getElementById("enhancedBox").style.display="block";

 status.textContent="Your enhanced prompt is ready!";
 btn.disabled=false;
 btn.textContent="✨ Enhance Prompt";
}

function useEnhanced(){
 const enhanced=document.getElementById("enhancedPrompt").value;
 document.getElementById("prompt").value=enhanced;
 document.getElementById("prompt").scrollIntoView({behavior:"smooth",block:"center"});
 document.getElementById("imageStatus").textContent="Enhanced prompt added. Ready to generate!";
}

async function copyPrompt(){
 const value=document.getElementById("prompt").value;
 if(!value.trim())return alert("Enter a prompt first.");
 await navigator.clipboard.writeText(value);
 alert("Prompt copied!");
}

async function copyEnhanced(){
 const value=document.getElementById("enhancedPrompt").value;
 if(!value)return;
 await navigator.clipboard.writeText(value);
 alert("Enhanced prompt copied!");
}

async function generateImage(){
 const prompt=document.getElementById("prompt").value.trim();
 const ratio=document.getElementById("ratio").value;
 const style=document.getElementById("style").value;
 const btn=document.getElementById("generateBtn");
 const status=document.getElementById("imageStatus");
 const result=document.getElementById("result");
 const img=document.getElementById("generatedImage");

 if(!prompt){
  status.textContent="Please enter an image description.";
  return;
 }

 btn.disabled=true;
 btn.textContent="Generating...";
 status.textContent="Creating your image. Please wait...";
 result.style.display="none";

 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    prompt:prompt,
    ratio:ratio,
    style:style
   })
  });

  if(!response.ok){
   let message="Image generation failed: "+response.status;
   try{
    const error=await response.json();
    if(error.details)message+=" — "+error.details;
    else if(error.error)message+=" — "+error.error;
   }catch(e){}
   throw new Error(message);
  }

  const blob=await response.blob();
  const imageURL=URL.createObjectURL(blob);
  img.src=imageURL;
  result.style.display="block";
  status.textContent="Your image is ready!";
  result.scrollIntoView({behavior:"smooth",block:"start"});

 }catch(error){
  status.textContent="Error: "+error.message;
 }finally{
  btn.disabled=false;
  btn.textContent="Generate Image";
 }
}

function downloadImage(){
 const img=document.getElementById("generatedImage");
 if(!img.src)return;
 const link=document.createElement("a");
 link.href=img.src;
 link.download="youssef-ai-image.png";
 document.body.appendChild(link);
 link.click();
 link.remove();
}
</script>
</body>
</html>
